<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SEE3GRE - 3ª Gerência Regional de Educação</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <!-- Cabeçalho Institucional -->
    <header class="site-header">
        <img src="/static/img/cabecalho.jpeg" alt="3ª Gerência Regional de Educação - Secretaria de Estado da Educação" class="banner-full">
    </header>

    <!-- Banner Principal Abaixo do Cabeçalho -->
    <section class="hero-banner">
        <img src="/static/img/cabecalho_abaixo.jpeg" alt="Transformando a Educação na 3ª Regional" class="banner-full">
    </section>

    <!-- Grade Dinâmica dos Núcleos (NUDEA, NUAFS, NUCOM, NUDPE, NUTCI) -->

        <h1 class="section-title">Núcleos e Sistemas SEE3GRE</h1>
        <div class="grid-modules" id="modules-grid"></div>
    </main>

    <!-- Rodapé Institucional -->
    <footer class="site-footer">
        <img src="/static/img/roda_pe.jpeg" alt="Secretaria da Educação da Paraíba - 3ª Gerência Regional de Educação" class="banner-full">

    <script src="/static/js/main.js" type="module"></script>
