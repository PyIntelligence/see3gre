version: '3.8'

networks:
  see3gre_network:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Gateway / Proxy Reverso (Nginx + Servidor do Portal Hub)
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: see3gre_gateway
    ports:
      - "80:80"
    volumes:
      # Arquivo de configuração do Nginx
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Pasta do Portal Hub (contendo static/ e templates/)
      - ./see3gre:/usr/share/nginx/html/see3gre:ro
    networks:
      - see3gre_network
    restart: always

