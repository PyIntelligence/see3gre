server {
    listen 80;
    server_name localhost;

    # DNS interno do Docker para resolução dinâmica de rotas (evita queda do Nginx se algum container estiver offline)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 1. Portal Hub Principal (HTMLs dentro da pasta templates)
    location / {
        root /usr/share/nginx/html/see3gre/templates;
        index index.html nudea.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Mapeamento de Arquivos Estáticos (CSS, JS e as imagens .jpeg em static/img/)
    location /static/ {
        alias /usr/share/nginx/html/see3gre/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Satélite PWA 1 (Aplicação Flask) - Uso de variável evita travamento no boot
    location /spokes/pwa_area_1/ {
        set $pwa1_endpoint http://pwa_area_1:5000/;
        proxy_pass $pwa1_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Satélite Power BI Service - Uso de variável evita travamento no boot
    location /spokes/powerbi_service/ {
        set $powerbi_endpoint http://powerbi_service:5001/;
        proxy_pass $powerbi_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Modelo para os novos Núcleos (NUAFS, NUCOM, NUDPE, NUTCI e serviços NUDEA)
    # Descomente e ajuste a porta conforme os serviços forem adicionados no Docker:
    # --------------------------------------------------------------------------
    # location /spokes/nuafs/ {
    #     set $nuafs_endpoint http://nuafs_service:5002/;
    #     proxy_pass $nuafs_endpoint;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}