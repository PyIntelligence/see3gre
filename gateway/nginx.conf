server {
    listen 80;
    server_name localhost;

    # Portal Hub Principal
    location / {
        root /usr/share/nginx/html/see3gre;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Satélite PWA 1 (Flask)
    location /spokes/pwa_area_1/ {
        proxy_pass http://pwa_area_1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Satélite Power BI Service
    location /spokes/powerbi_service/ {
        proxy_pass http://powerbi_service:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}