server {
    listen 80;
    server_name localhost;

    # DNS interno do Docker para resolução dinâmica de rotas (evita queda do Nginx se o container estiver offline)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 1. Portal Hub Principal (HTMLs dentro da pasta templates)
    location / {
        root /usr/share/nginx/html/see3gre/templates;
        index index.html nudea.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Mapeamento de Arquivos Estáticos (CSS, JS, Imagens em static/)
    location /static/ {
        alias /usr/share/nginx/html/see3gre/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Satélite PWA 1 (Aplicação Flask) - Variável evita travamento no boot
    location /spokes/pwa_area_1/ {
        set $pwa1_endpoint http://pwa_area_1:5000/;
        proxy_pass $pwa1_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Satélite Power BI Service - Variável evita travamento no boot
    location /spokes/powerbi_service/ {
        set $powerbi_endpoint http://powerbi_service:5001/;
        proxy_pass $powerbi_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}