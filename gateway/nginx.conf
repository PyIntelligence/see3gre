server {
    listen 80;
    server_name localhost;

    # DNS interno do Docker para resolução dinâmica de rotas (evita queda do Nginx se algum container estiver offline)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Limite de envio para formulários ou anexos futuros nos módulos
    client_max_body_size 20M;

    # 1. Service Worker sem cache (força o navegador a reconhecer novas versões do PWA imediatamente)
    location = /static/sw.js {
        alias /usr/share/nginx/html/see3gre/static/sw.js;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 2. Mapeamento de Arquivos Estáticos (CSS, JS e imagens .png em static/img/ e subpastas dos núcleos)
    location ^~ /static/ {
        alias /usr/share/nginx/html/see3gre/static/;
        sendfile off;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 3. Portal Hub Principal e Subportais (/, /nudea, /nutci, /quadro, etc. via Backend Flask)
    location / {
        set $flask_backend http://backend-flask:5000;
        proxy_pass $flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Satélite PWA 1 (Aplicação Flask) - Uso de variável evita travamento no boot
    location /spokes/pwa_area_1/ {
        set $pwa1_endpoint http://pwa_area_1:5000/;
        proxy_pass $pwa1_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Satélite Power BI Service - Uso de variável evita travamento no boot
    location /spokes/powerbi_service/ {
        set $powerbi_endpoint http://powerbi_service:5001/;
        proxy_pass $powerbi_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Modelo para os novos Núcleos (NUAFS, NUCOM, NUDPE e serviços NUDEA)
    # Descomente e ajuste a porta conforme os serviços forem adicionados no Docker:
    # --------------------------------------------------------------------------
    # location /spokes/nuafs/ {
    #     set $nuafs_endpoint http://nuafs_service:5002/;
    #     proxy_pass $nuafs_endpoint;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}